name: Kaede CI

on:
  push:
    branches: [main]
    paths:
      - "apps/kaede/**"
      - ".github/workflows/kaede-ci.yml"
  pull_request:
    branches: [main, 219/main]
    paths:
      - "apps/kaede/**"
      - ".github/workflows/kaede-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks-and-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/kaede
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 11.18.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: apps/kaede/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format Check
        run: pnpm exec prettier --check .

      - name: Type Check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: DB and S3 Tests
        shell: bash
        run: |
          pnpm run test:db &
          db_pid=$!
          pnpm run test:s3 &
          s3_pid=$!

          db_status=0
          wait "$db_pid" || db_status=$?
          s3_status=0
          wait "$s3_pid" || s3_status=$?

          echo "DB Test exit code: $db_status"
          echo "S3 Test exit code: $s3_status"
          if (( db_status != 0 || s3_status != 0 )); then
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Docker Image Build
        run: DOCKER_BUILDKIT=1 docker build -f Dockerfile .
