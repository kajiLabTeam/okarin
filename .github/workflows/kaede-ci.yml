name: Kaede CI

on:
  push:
    branches: [main]
    paths:
      - "apps/kaede/**"
      - ".github/workflows/kaede-ci.yml"
  pull_request:
    branches: [main, 219/main]
    paths:
      - "apps/kaede/**"
      - ".github/workflows/kaede-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kaede
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: apps/kaede/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format Check
        run: pnpm exec prettier --check .

      - name: Type Check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: DB Test
        run: pnpm run test:db

      - name: S3 Test
        run: pnpm run test:s3

      - name: Build
        run: pnpm build

      - name: Docker Image Build
        run: DOCKER_BUILDKIT=1 docker build -f Dockerfile .
